<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#fde047" stroke-width="8" stroke-dasharray="8 12" opacity="0.6"/>
  <!-- Sacred Saffron Flag (Bhagwa Dhwaj) & Om / Gada Symbol -->
  <g transform="translate(106, 86)" filter="url(#glow)">
    <path d="M40 30 L220 110 L80 170 L240 240 L40 310 Z" fill="#ffedd5" stroke="#f59e0b" stroke-width="6"/>
    <rect x="25" y="20" width="16" height="340" rx="8" fill="#d97706"/>
    <!-- Sacred Devanagari Om in center -->
    <text x="110" y="195" font-family="'Noto Sans Devanagari', 'Rozha One', serif" font-size="95" font-weight="bold" fill="#7c2d12" text-anchor="middle">ॐ</text>
  </g>
</svg>

